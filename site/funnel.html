        // Sber Brand Color Palette
        const brandColors = ['#21A038', '#00B074', '#0097A7', '#2E5BFF', '#7928CA', '#FF9900'];

            return (n || 0).toLocaleString('ru-RU');

        function fmtRub(n) {
            return fmtNum(Math.round(n)) + ' ₽';
        }

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + brand).classList.add('active');

            if (brand === 'ALL') {
                document.getElementById('headerUpdateDate').innerText = rawData.OVERALL_LATEST_DATE || '19.08.2026 в 23:59';
                renderComparisonView();
            } else {
                document.getElementById('headerUpdateDate').innerText = rawData[brand].latest_lead_date || '19.08.2026';
                renderSingleBrandView(brand);
            }
            lucide.createIcons();
        }

            const brands = ['JETOUR', 'LADA', 'TENET', 'CHANGAN', 'GAC', 'SOLARIS'];

                        </h2>

                                    <th class="py-3 px-4 text-right">Расчеты</th>
                                    <th class="py-3 px-4 text-right">Офферы</th>
