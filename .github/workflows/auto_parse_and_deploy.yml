name: Auto Parse & Deploy Dashboard

on:
  push:
    paths:
      - 'raw_data/**'
      - 'scripts/**'
      - 'site/**'
    branches:
      - main
      - feature/my-updates
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tesseract OCR (for screenshot parsing)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pillow pytesseract

      - name: Run Parser Engine
        run: |
          python scripts/parser_engine.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy site --project-name=dashbord-partners1 --branch=main --commit-dirty=true

      - name: Commit and push updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data.json data.json || true
          if git diff --staged --quiet; then
            echo "No data.json changes to commit."
          else
            git commit -m "chore: auto-update data.json from raw_data [skip ci]"
            git push
          fi
